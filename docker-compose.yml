services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    env_file: .env
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - tsdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  simulator:
    build: ./simulator
    environment:
      MQTT_HOST: mosquitto
      MQTT_PASSWORD: ${MQTT_PASSWORD:?MQTT_PASSWORD is not set in .env}
    depends_on:
      - mosquitto
    restart: on-failure

  ingestion:
    build: ./ingestion
    environment:
      MQTT_HOST: mosquitto
      MQTT_PASSWORD: ${MQTT_PASSWORD:?MQTT_PASSWORD is not set in .env}
      POSTGRES_HOST: timescaledb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in .env}
    depends_on:
      mosquitto:
        condition: service_started
      timescaledb:
        condition: service_healthy
    restart: on-failure

  twin:
    build: ./twin
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in .env}
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: on-failure

  api:
    build: ./api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is not set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set in .env}
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  tsdata: