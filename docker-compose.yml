   services:
     mosquitto:
       image: eclipse-mosquitto:2
       ports:
         - "1883:1883"
       volumes:
         - ./mosquitto/config:/mosquitto/config

     timescaledb:
       image: timescale/timescaledb:latest-pg16
       env_file: .env
       ports:
         - "5432:5432"
       volumes:
         - tsdata:/var/lib/postgresql/data

   volumes:
     tsdata: