services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    env_file: .env
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - tsdata:/var/lib/postgresql/data

volumes:
  tsdata: